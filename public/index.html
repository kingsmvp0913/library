<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>借還台 · 圖書管理系統</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <nav>
    <a href="/index.html">借還台</a>
    <a href="/catalog.html">館藏</a>
    <a href="/shelves.html">書櫃</a>
    <a href="/categories.html">類型</a>
    <a href="/borrowers.html">借閱人</a>
    <a href="/loans.html">借閱紀錄</a>
    <a href="/tools.html">匯入匯出</a>
    <a href="/settings.html">設定</a>
    <span class="omni">
      <input id="omni" placeholder="搜尋書名、作者、編號、借閱人、書櫃…" autocomplete="off">
      <div class="omni-panel" id="omniPanel"></div>
    </span>
    <span class="net-badge">偵測中…</span>
  </nav>
  <main>
    <div class="card scan-box">
      <div class="batch-borrower">
        <label for="borrower"><strong>1. 選擇借閱人</strong> <span class="muted">（只有歸還時可不選）</span></label>
        <select id="borrower">
          <option value="">載入借閱人…</option>
        </select>
      </div>
      <label for="scan"><strong>2. 連續掃描館藏編號</strong></label>
      <div class="row">
        <input id="scan" placeholder="掃描書本上的編號（或直接輸入後按 Enter）" autocomplete="off">
        <button id="camera" class="no-print">📷 用鏡頭掃</button>
      </div>
      <p class="muted">掃描只會加入清單，不會立即借出或歸還。</p>
      <video id="video" hidden playsinline style="width:100%;max-width:420px;margin-top:12px"></video>
    </div>
    <div id="result"></div>
    <div class="card" id="batchCard" hidden>
      <div class="row batch-heading">
        <h2>3. 確認這一批 <span class="batch-count" id="batchCount">0</span></h2>
        <button id="clearBatch" disabled>清空清單</button>
      </div>
      <p class="muted" id="batchEmpty">尚未掃描任何館藏。</p>
      <div class="batch-table" id="batchTable" hidden>
        <table>
          <thead><tr><th>編號</th><th>名稱</th><th>動作</th><th>處理方式</th><th></th></tr></thead>
          <tbody id="batchItems"></tbody>
        </table>
      </div>
      <div class="row batch-actions">
        <strong id="batchSummary">待借出 0 冊 · 待歸還 0 冊</strong>
        <button class="primary" id="confirmBatch" disabled>確認全部（0）</button>
      </div>
    </div>
    <div class="card open-loans">
      <h3>目前外借中 <span class="muted" id="openLoanCount"></span></h3>
      <div class="batch-table"><table><tbody id="openLoans"></tbody></table></div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/omnisearch.js"></script>
  <script src="/js/scan-input.js"></script>
  <script src="/js/page-scan.js"></script>
</body>
</html>
